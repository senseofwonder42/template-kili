repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=500'] # Data belongs in DVC, not in git
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Notebooks are versioned without their outputs
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout

  # Secret scanning
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.29.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      # 1. Run the linter and fix everything possible
      - id: ruff-check
        args: [--fix]
        files: ^(src|tests|examples|scripts)/

      # 2. Run the formatter on the cleaned code
      - id: ruff-format
        files: ^(src|tests|examples|scripts)/
